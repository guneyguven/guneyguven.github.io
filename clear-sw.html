<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clear Service Worker & Caches</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:2rem}</style>
</head>
<body>
  <h1>Clear Service Worker & Caches</h1>
  <p>Click the button below to unregister service workers and clear site caches, then reload.</p>
  <button id="run">Clear and Reload</button>
  <pre id="out" style="white-space:pre-wrap;margin-top:1rem;color:#333"></pre>
  <script>
    async function log(msg){ document.getElementById('out').textContent += msg + '\n'; }
    document.getElementById('run').addEventListener('click', async function(){
      try{
        if('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          for(const r of regs){ await r.unregister(); log('unregistered: '+(r.scope||'')); }
        } else { log('serviceWorker not supported'); }
        if(window.caches){
          const keys = await caches.keys();
          for(const k of keys){ await caches.delete(k); log('deleted cache: '+k); }
        } else { log('Cache API not supported'); }
        log('done — reloading in 1s');
        setTimeout(()=>location.href='/',1000);
      }catch(e){ log('error: '+e.message); }
    });
  </script>
</body>
</html>
