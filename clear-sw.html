<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clear Service Worker & Cache</title>
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:2rem;color:#111}</style>
  </head>
  <body>
    <h1>Clearing service worker and caches…</h1>
    <p id="status">Running...</p>
    <script>
      (async function(){
        try{
          // unregister all service workers
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r=>r.unregister()));
          }

          // clear all caches
          if (window.caches && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }

          // optional: remove theme override to let site logic re-evaluate
          try{ localStorage.removeItem('theme'); localStorage.removeItem('siteTheme'); }catch(e){}

          document.getElementById('status').innerText = 'Done — reloading in 1s.';
          setTimeout(()=>location.replace('/'), 1000);
        }catch(err){
          document.getElementById('status').innerText = 'Error: ' + err;
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
