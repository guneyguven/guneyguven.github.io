name: Build blog posts from text files

on:
  push:
    branches:
      - features/blog
      - main
    paths:
      - "Blog/inbox/**"
      - "scripts/build_blog.py"
      - ".github/workflows/blog-from-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate blog pages
        run: python3 scripts/build_blog.py
      - name: Commit generated pages
        run: |
          if git diff --quiet -- Blog/blog/index.html Blog/posts; then
            echo "No generated blog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Blog/blog/index.html Blog/posts
          git commit -m "Build blog pages from text files"
          git push
